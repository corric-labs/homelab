name: Drift Detect

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SOPS age key
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/sops/age
          printf '%s\n' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Drift placeholder
        shell: bash
        run: |
          set -euo pipefail
          echo "Drift detection scaffold configured."
          echo "Implement stack-by-stack read-only plan in Phase 1."
